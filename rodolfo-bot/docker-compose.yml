services:
  rodolfo:
    build: .
    container_name: rodolfo-bot
    restart: unless-stopped
    env_file: .env
    ports:
      # Con nginx: "127.0.0.1:5000:5000" (solo local, nginx expone al exterior)
      # Sin nginx: "5000:5000" (directo, protege con firewall en Hetzner)
      - "127.0.0.1:5000:5000"
    volumes:
      # Persistir modelos de Whisper para no re-descargar entre reinicios
      - whisper-cache:/root/.cache/whisper
    healthcheck:
      # /health es público (no requiere token) — ideal para healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  whisper-cache:
